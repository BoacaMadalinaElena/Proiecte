<div class=" d-flex containerStart m-0 p-0">
    <div class="content">
        <form id="formLanguage" *ngIf="language === 'ro'" (change)="onSelectionChange($event)" class="mt-0 pt-0">
            <select class="me-2  pt-2 language py-auto">
                <option value="ro">{{translations.startUp.language1}}</option>
                <option value="en">{{translations.startUp.language2}}</option>
            </select>
        </form>
        <form id="formLanguage" *ngIf="language === 'en'" (change)="onSelectionChange($event)" class="mt-0">
            <select class="me-2  pt-2 language py-auto">
                <option value="en">{{translations.startUp.language2}}</option>
                <option value="ro">{{translations.startUp.language1}}</option>
            </select>
        </form>
        <br>
        <br>
        <br>
        <br>
        <br>
        <p id="titleStartUp" class="mb-5 pb-0">{{translations.changePassword.title}}</p>
        <form id="formStartUp" #userForm="ngForm" (ngSubmit)="onClickSubmit(userForm.value)">
            <div class="form-group">
                <label class="me-2">{{translations.changePassword.password1}}</label>
                <input type="password" name="password1" [(ngModel)]="password1" (input)="checkPasswordMatch()">
            </div>
            <div class="form-group mt-4">
                <label class="me-2">{{translations.changePassword.password2}}</label>
                <input type="password" name="password2" [(ngModel)]="password2" (input)="checkPasswordMatch()">
            </div>
            <br />
            <div class="message">
                <p id="message" *ngIf="messageFromServer">{{ messageFromServer }}</p>
                <p id="message" *ngIf="passwordMismatch">{{ translations.changePassword.errorNotEqual }}</p>
            </div>
            <br>
            <input type="submit" [class.disabled-button]="passwordMismatch || password1.length < 5 || password2.length < 5" [disabled]="passwordMismatch || password1.length < 5 || password2.length < 5" value="{{translations.changePassword.send}}">
        </form>
        <app-popup></app-popup>
    </div>
</div>
<app-loader *ngIf="loaderFlag"></app-loader>
