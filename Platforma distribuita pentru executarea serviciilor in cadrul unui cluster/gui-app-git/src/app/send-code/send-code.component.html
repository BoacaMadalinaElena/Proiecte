<div class=" d-flex containerStart m-0 p-0">
    <div class="content">
        <form id="formLanguage" *ngIf="language === 'ro'" (change)="onSelectionChange($event)" class="mt-0 pt-0">
            <select class="me-2  pt-2 language py-auto">
                <option value="ro">{{translations.startUp.language1}}</option>
                <option value="en">{{translations.startUp.language2}}</option>
            </select>
        </form>
        <form id="formLanguage" *ngIf="language === 'en'" (change)="onSelectionChange($event)" class="mt-0">
            <select class="me-2  pt-2 language py-auto">
                <option value="en">{{translations.startUp.language2}}</option>
                <option value="ro">{{translations.startUp.language1}}</option>
            </select>
        </form>
        <br>
        <br>
        <br>
        <br>
        <br>
        <div class="container formTest mt-5 pt-5 text-center">
            <p id="titleStartUp" class="mb-5 mx-5 pb-0">{{translations.checkCode.message + " " + email}}</p>
            <input type="number" class="form-control mx-auto" [(ngModel)]="valoareInput">
            <p id="message" class="mt-4 mx-auto" >{{messageFromServer}}</p>
            <button class="btn btn-primary mt-4" (click)="submit()">{{translations.checkCode.finish}}</button>
          </div>
          <app-popup></app-popup>
    </div>
</div>
<app-loader *ngIf="loaderFlag"></app-loader>
