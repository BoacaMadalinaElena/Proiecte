<div class=" d-flex containerStart m-0 p-0">
    <div class="content">
     <!--   <img id="logoStartUp" src="/assets/images/logo.svg" alt="logo">-->
        <form id="formLanguage" *ngIf="language === 'ro'"  (change)="onSelectionChange($event)" class="mt-0 pt-0">
            <select  class="me-2  pt-2 language py-auto">
              <option value="ro">{{translations.startUp.language1}}</option>
              <option value="en">{{translations.startUp.language2}}</option>
            </select>
          </form>
          <form id="formLanguage" *ngIf="language === 'en'"  (change)="onSelectionChange($event)" class="mt-2">
            <select  class="me-2  pt-2 language py-auto">
              <option value="en">{{translations.startUp.language2}}</option>
              <option value="ro">{{translations.startUp.language1}}</option>
            </select>
          </form>
        <form id="formStartUp">
            <p id="titleStartUp" class="mb-5 pb-0 text-xl-center">{{translations.startUp.welcome}}</p>
            <p id="infoStartUp" class="mx-auto mt-0 pt-0">{{translations.startUp.message}}<a href="public-info">{{translations.startUp.link}}</a></p>
            <br>
            <a href="/login" id="startUpImgButtonLogin" class="my-0 py-0 mx-auto">{{translations.startUp.login}}</a>
            <br>
            <p id="orLable" class="my-0 py-0 mx-auto">{{translations.startUp.or}}</p>
            <br>
            <a href="/create-account" id="startUpImgButtonCreate" class="my-0 py-0 mx-auto">{{translations.startUp.create}}</a>
        </form>
    </div>
</div>
<app-popup></app-popup>
